name: Deploy Web to Vercel

on:
  push:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies (workspaces)
        run: npm ci --workspaces

      - name: Pull Vercel env (production)
        run: npx vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN" --cwd apps/web

      - name: Build (Vercel)
        run: npx vercel@latest build --prod --token "$VERCEL_TOKEN" --cwd apps/web

      - name: Deploy (Vercel)
        run: npx vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN" --cwd apps/web
