name: Deploy Web to Vercel

on:
  push:
    branches: ["main", "staging"]
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies (workspaces)
        run: npm ci --workspaces

      - name: Determine environment
        id: env
        run: |
          BRANCH="${GITHUB_REF##*/}"
          if [ "$BRANCH" = "main" ]; then
            echo "env=production" >> $GITHUB_OUTPUT
            echo "prod_flag=--prod" >> $GITHUB_OUTPUT
          else
            echo "env=preview" >> $GITHUB_OUTPUT
            echo "prod_flag=" >> $GITHUB_OUTPUT
          fi

      - name: Pull Vercel env
        run: npx vercel@latest pull --yes --environment=${{ steps.env.outputs.env }} --token "$VERCEL_TOKEN" --cwd apps/web

      - name: Build (Vercel)
        run: npx vercel@latest build ${{ steps.env.outputs.prod_flag }} --token "$VERCEL_TOKEN" --cwd apps/web

      - name: Deploy (Vercel)
        run: npx vercel@latest deploy --prebuilt ${{ steps.env.outputs.prod_flag }} --token "$VERCEL_TOKEN" --cwd apps/web
